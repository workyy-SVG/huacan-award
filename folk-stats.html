<!doctype html><html lang="zh-CN"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>四海故事 · 数据观察</title><style>*{box-sizing:border-box}body{margin:0;background:#081627;color:#e3efff;font:16px/1.55 system-ui}main{max-width:1200px;margin:auto;padding:5vw 4vw}header{border-left:4px solid #41e1d3;padding-left:18px}h1{font-size:clamp(32px,4vw,52px);margin:0}p,small{color:#a8bfd7}select,button{font:inherit;color:inherit;background:#122940;border:1px solid #36516b;border-radius:5px;padding:5px 10px}section{margin:16px 0;padding:20px;background:#0f2236;border:1px solid #28425a;border-radius:10px}h2{margin:0 0 14px;font-size:19px}#grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#grid section{margin-bottom:0}.row{display:grid;grid-template-columns:80px 1fr 48px;align-items:center;gap:10px;margin:10px 0}.track{background:#1c344a;height:13px;border-radius:3px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#437df3,#48e4d1)}#ring{width:160px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin:0 auto 15px}#ring b{background:#0f2236;border-radius:50%;width:112px;height:112px;display:grid;place-items:center;font-size:26px}.legend{display:inline-block;margin:4px 12px 4px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}details{margin-top:16px}summary,select{cursor:pointer}li{margin:5px}label{margin-right:14px;display:inline-block;margin-top:8px}@media(max-width:650px){#grid{grid-template-columns:1fr}.row{grid-template-columns:70px 1fr 40px}}body{background:#f7f1e1;color:#183e50}main{padding:24px clamp(12px,3vw,36px)}header{border-color:#a95037}h1{font-size:clamp(24px,3vw,35px)}section{background:#fffaf0;border-color:#d1bf99}p,small{color:#4e605f}select{background:#f1f6f6;border-color:#91aaa9}#ring{transform:rotateX(23deg);box-shadow:0 2px #617475,0 5px #566a68,0 9px #495d5b}#ring b{background:#fffaf0;box-shadow:inset 0 4px 3px #cabb9e}.track{background:#e4e4d8;overflow:visible}.fill{background:linear-gradient(#518782,#35665f);box-shadow:0 3px #254c4a;transform:skewY(-1deg)}#themes .fill{background:linear-gradient(#bb8062,#a05c41);box-shadow:0 3px #804431}</style><main><header><small>字里寻踪　／　四海故事</small><h1>民俗样本统计</h1><p>读完各地故事后，可以在这里一起回看：这些故事来自哪里，围绕哪些汉字，又记录了哪些习俗？选择地区或汉字，即可比较对应的收录情况。</p></header><section><label>地区 <select id="region"></select></label><label>汉字 <select id="word"></select></label><span id="count"></span></section><div id="grid"><section><h2>地区占比</h2><div id="ring"></div><div id="legend"></div><p id="regionNote"></p></section><section><h2>各汉字收录量</h2><div id="bars"></div><small>单位：条。<span id="wordNote"></span></small></section></div><section><h2>习俗主题分布</h2><div id="themes"></div><small><span id="themeNote"></span>按故事标题与内容人工归纳，每条只计入一个主要主题。仅反映本站选材。</small><details><summary>查看统计明细</summary><ul id="records"></ul></details></section></main><script>const rows=[["年","福建泉州","赶回来吃的那顿饭"],["年","金门","给没回来的人留一副碗筷"],["门","福建泉州","除夕贴春联"],["门","台湾（辞典所载）","门左右贴春联"],["茶","中国大陆（申报范围）","以茶待客"],["茶","台湾客家社群","动手制作擂茶"],["船","福建厦门、泉州沿海","沿海社区送王船"],["船","台湾屏东东港","迎王祭典中的王船"],["灯","福建泉州","针刺无骨灯"],["灯","台湾（名录所载）","竹纸工艺做花灯"],["圆","浙江宁波海曙","老街长桌宴里的团聚"],["圆","台湾（文献馆所载）","元宵吃汤圆"],["年","香港","长辈先动筷，晚辈送祝福"],["年","澳门","贴挥春，吃团年饭"],["门","香港","写挥春迎新"],["门","澳门","年末悬挥春贴门神"],["茶","香港","到茶楼饮茶"],["茶","澳门","点心配一壶茶"],["船","香港大澳","龙舟沿水道游涌"],["船","澳门南湾湖","端午龙舟竞渡"],["灯","香港","中秋看彩灯"],["灯","澳门新街坊","做鱼灯与花草纸灯"],["圆","香港","元宵节的汤圆"],["圆","澳门旅游学院","动手搓汤丸过元宵"],["年","新加坡","一起把鱼生捞起来"],["门","新加坡","用春联装点家里"],["茶","新加坡","茶作为祭祖供品"],["船","马来西亚马六甲","华人社群传承送王船"],["灯","新加坡","传统花灯制作"],["圆","新加坡","春节团圆饭"]], groups=['中国大陆','台湾与金门','香港','澳门','东南亚'],letters=[...'年门茶船灯圆'],names=['饮食与团聚','节庆装饰','传统工艺','祭祀仪式','节庆活动'],types=[0,0,1,1,0,2,3,3,2,2,0,0,0,0,1,1,0,0,3,4,4,2,0,2,0,1,3,3,2,0],colors=['#35675f','#aa503a','#ba904c','#476c86','#83718a'];function group(p){return /^(台湾|金门)/.test(p)?1:p.startsWith('香港')?2:p.startsWith('澳门')?3:/新加坡|马六甲/.test(p)?4:0}function options(el,a){for(const x of ['全部',...a])el.add(new Option(x,x))}options(region,groups);options(word,letters);function chart(el,labels,vals){el.replaceChildren();let max=Math.max(1,...vals);labels.forEach((label,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML='<span>'+label+'</span><div class="track"><div class="fill" style="width:'+vals[i]/max*100+'%"></div></div><b>'+vals[i]+'</b>';el.append(d)})}function draw(){let g=groups.map(()=>0),w=letters.map(()=>0),t=names.map(()=>0),n=0;records.replaceChildren();rows.forEach(([c,p,title],i)=>{let j=group(p);if(region.value!=='全部'&&region.value!==groups[j]||word.value!=='全部'&&word.value!==c)return;n++;g[j]++;w[letters.indexOf(c)]++;t[types[i]]++;let li=document.createElement('li');li.textContent=[p,c,title,names[types[i]]].join(' · ');records.append(li)});count.textContent='当前 '+n+' / 30 条';let start=0;ring.style.background='conic-gradient('+g.map((v,i)=>{let a=start;start+=v/n*100;return colors[i]+' '+a+'% '+start+'%'}).join(',')+')';ring.innerHTML='<b>'+n+' 条</b>';legend.innerHTML=g.map((v,i)=>'<span class="legend"><i class="dot" style="background:'+colors[i]+'"></i>'+groups[i]+' '+Math.round(v/n*100)+'%</span>').join('');chart(bars,letters,w);chart(themes,names,t);
document.getElementById('regionNote').textContent='当前故事覆盖 '+g.filter(Boolean).length+' 个地区分组，百分比按所选故事总数计算。';
document.getElementById('wordNote').textContent='当前涵盖 '+w.filter(Boolean).length+' 个汉字，每根条形对应一个字的故事数。';
const peak=Math.max(...t);
document.getElementById('themeNote').textContent='当前收录最多的主题为'+names.filter((_,i)=>t[i]===peak).join('、')+'（'+peak+' 条）。';
}region.onchange=word.onchange=draw;draw()</script></html>
