<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>字里寻踪：两岸四海的生活印记</title>
</head><body>
<style>
* {box-sizing:border-box}
body {margin:0; background:radial-gradient(ellipse at 52% 18%,#fdfcf9 0%,#f2f1ee 60%,#e6e5e1); color:#302b28}
#lookup-status {text-align:center;font:1rem/1.5 sans-serif;margin:0 auto;padding:10px}


.globe-cover {
  width:min(100%, 900px, calc((100dvh - 12px) * 1600 / 2416));
  aspect-ratio:1600/2416; margin:auto;
  position:relative; container-type:inline-size; overflow:hidden;
  background:#f8f6f1;
}
.globe-art {
  position:absolute; top:-20cqw; left:0; display:block;
  width:100%; height:auto; pointer-events:none;
}
.globe-start,.globe-search { position:absolute; border-radius:999px; }
.globe-start { left:27%; top:116.53cqw; width:46.5%; height:9.97cqw; }
.globe-search { left:7.7%; top:135.75cqw; width:84.8%; height:9.79cqw; }
.globe-search input {
  width:100%; height:100%; border:0; border-radius:inherit; box-sizing:border-box;
  background:transparent; color:transparent; padding:0 5%;
  font:clamp(16px,3.5cqw,20px) "Songti SC","SimSun",serif;
}
.globe-search input:focus,.globe-search input:valid {background:#f7f4ef;color:#302b28;}
.globe-start:focus-visible,.globe-search input:focus-visible {outline:2px solid #8d291a;}

.globe-search select{width:100%;height:100%;box-sizing:border-box;border:1px solid #dfd3c5;border-radius:999px;background:#f7f4ef;color:#3c2f29;padding:0 5%;font:clamp(16px,3.5cqw,20px) "Songti SC","SimSun",serif}
.lookup-result{max-width:42rem;margin:12px auto;padding:18px;background:#fffaf2;color:#3c2f29}.lookup-result a{color:#8c291d}
</style>
<main class="globe-cover" aria-label="字里寻踪。 同一个字，连接不同地方的生活记录">
  <img class="globe-art" src="globe-cover-reference.png" width="1600" height="2848" alt="折页地图，标有两岸、香港、澳门与海外华人社群">
  <a class="globe-start" href="featured.html" target="_self" aria-label="选一个字，开始寻踪"></a>
  <div class="globe-search" id="lookup"><select id="hanzi" aria-label="查一个我感兴趣的字"><option value="">查一个我感兴趣的字</option><option value="年">年</option><option value="门">门</option><option value="茶">茶</option><option value="船">船</option><option value="灯">灯</option><option value="圆">圆</option></select></div>
</main>

<section id="lookup-result" class="lookup-result" hidden>
<h2 id="word"></h2><p id="status" role="status"></p><div id="definitions"></div>
<p><a id="source" target="_blank" rel="noopener">查看萌典原词条</a></p>
<button id="retry" type="button" hidden>重新查询</button> <a id="story">查看精选故事</a>
</section>
<script>
const select = document.getElementById('hanzi');
const panel = document.getElementById('lookup-result');
const heading = document.getElementById('word');
const status = document.getElementById('status');
const definitions = document.getElementById('definitions');
const source = document.getElementById('source');
const retry = document.getElementById('retry');
const story = document.getElementById('story');
const entries = {年:['年','nian.html'],门:['門','men.html'],茶:['茶','cha.html'],船:['船','chuan.html'],灯:['燈','deng.html'],圆:['圓','yuan.html']};
let active;
async function lookup() {
  active?.abort();
  if (!select.value) {panel.hidden = true; return;}
  const word = select.value;
  const [form, storyUrl] = entries[word];
  const controller = new AbortController();
  active = controller;
  const timeout = setTimeout(() => controller.abort(), 10000);
  panel.hidden = false;
  heading.textContent = word;
  status.textContent = '正在查询萌典…';
  definitions.replaceChildren();
  retry.hidden = true;
  source.href = 'https://www.moedict.tw/' + encodeURIComponent(form);
  story.href = storyUrl;
  panel.scrollIntoView({block:'nearest'});
  try {
    const response = await fetch('https://www.moedict.tw/uni/' + encodeURIComponent(form), {signal:controller.signal});
    if (!response.ok) throw new Error('Dictionary request failed');
    const entry = await response.json();
    if (active !== controller || select.value !== word) return;
    if (entry.title !== form || !Array.isArray(entry.heteronyms)) throw new Error('Unexpected entry');
    heading.textContent = word === form ? word : word + ' · 萌典字形「' + form + '」';
    status.textContent = [entry.radical && '部首 ' + entry.radical, entry.stroke_count && '词典字形笔画 ' + entry.stroke_count].filter(Boolean).join('　');
    for (const reading of entry.heteronyms) {
      const paragraph = document.createElement('p');
      paragraph.textContent = [reading.pinyin || reading.bopomofo, reading.definitions?.find(item => item.def)?.def].filter(Boolean).join('　');
      definitions.append(paragraph);
    }
  } catch {
    if (active !== controller || select.value !== word) return;
    status.textContent = '暂时无法取得词条，可重试或查看萌典原词条。';
    retry.hidden = false;
  } finally {clearTimeout(timeout);}
}
select.addEventListener('change', lookup);
retry.addEventListener('click', lookup);
</script>
</body></html>
