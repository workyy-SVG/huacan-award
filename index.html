<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>字里寻踪：两岸四海的生活印记</title>
<script>
const query = new URLSearchParams(location.search);
if (query.get('story') === 'nian' || /^#(?:nian-|form$|keepsake$)/.test(location.hash)) {
  location.replace('nian.html' + location.hash);
}
</script></head><body>
<style>
* {box-sizing:border-box}
body {margin:0; background:radial-gradient(ellipse at 52% 18%,#fdfcf9 0%,#f2f1ee 60%,#e6e5e1); color:#302b28}
#lookup-status {text-align:center;font:1rem/1.5 sans-serif;margin:0 auto;padding:10px}


.globe-cover {
  width:min(100%, 900px, calc((100dvh - 12px) * 1600 / 2416));
  aspect-ratio:1600/2416; margin:auto;
  position:relative; container-type:inline-size; overflow:hidden;
  background:#f8f6f1;
}
.globe-art {
  position:absolute; top:-20cqw; left:0; display:block;
  width:100%; height:auto; pointer-events:none;
}
.globe-start,.globe-search { position:absolute; border-radius:999px; }
.globe-start { left:27%; top:116.53cqw; width:46.5%; height:9.97cqw; }
.globe-search { left:7.7%; top:135.75cqw; width:84.8%; height:9.79cqw; }
.globe-search input {
  width:100%; height:100%; border:0; border-radius:inherit; box-sizing:border-box;
  background:transparent; color:transparent; padding:0 5%;
  font:clamp(16px,3.5cqw,20px) "Songti SC","SimSun",serif;
}
.globe-search input:focus,.globe-search input:valid {background:#f7f4ef;color:#302b28;}
.globe-start:focus-visible,.globe-search input:focus-visible {outline:2px solid #8d291a;}

</style>
<main class="globe-cover" aria-label="字里寻踪。 同一个字，连接不同地方的生活记录">
  <img class="globe-art" src="globe-cover-reference.png" width="1600" height="2848" alt="折页地图，标有两岸、香港、澳门与海外华人社群">
  <a class="globe-start" href="featured.html" target="_self" aria-label="选一个字，开始寻踪"></a>
  <form id="lookup" class="globe-search" method="get" role="search">
    <input name="hanzi" aria-label="查一个我感兴趣的字" autocomplete="off" enterkeyhint="search" required>
  </form>
</main>

<section id="lookup-status" aria-live="polite" hidden style="max-width:42rem;margin:auto;padding:1.5rem;text-align:left;background:#fffaf2">
<h2 id="word"></h2><p id="message"></p><div id="senses"></div>
<a id="credit" hidden target="_blank" rel="noopener">查看萌典原词条</a>
<button id="retry" hidden>重新查询</button> <a id="featured-result" hidden>查看精选故事</a>
</section>
<script>
const word = query.get('hanzi')?.trim();
const panel = document.querySelector('#lookup-status');
const message = document.querySelector('#message');
const retry = document.querySelector('#retry');
async function lookupWord() {
  retry.hidden = true;
  message.textContent = '正在查询…';
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    let entry;
    const alternate = {门:'門',圆:'圓',团:'團',龙:'龍',灯:'燈'}[word];
    for (const form of alternate ? [word, alternate] : [word]) {
      const response = await fetch('https://www.moedict.tw/uni/' + encodeURIComponent(form), {signal:controller.signal});
      if (response.status === 404) continue;
      if (!response.ok) throw Error();
      entry = await response.json();
      if (!entry.title || !Array.isArray(entry.heteronyms)) throw Error();
      break;
    }
    if (!entry) {message.textContent='词典未找到这个字。可以试试繁体写法。';return;}
    document.querySelector('#word').textContent = word === entry.title ? word : word + ' · 词典字形「' + entry.title + '」';
    message.textContent = [entry.radical && '部首 '+entry.radical,entry.stroke_count && '词典笔画 '+entry.stroke_count].filter(Boolean).join('　');
    for (const reading of entry.heteronyms) {
      const line = document.createElement('p');
      line.textContent = [reading.pinyin || reading.bopomofo, reading.definitions?.find(s=>s.def)?.def].filter(Boolean).join('　');
      document.querySelector('#senses').append(line);
    }
    const credit = document.querySelector('#credit');
    credit.href = 'https://www.moedict.tw/' + encodeURIComponent(entry.title);
    credit.textContent='词条摘自萌典 · 查看完整释义与出处';
    credit.hidden=false;
  } catch {message.textContent='暂时无法连接词典，请重试。';retry.hidden=false;}
  finally {clearTimeout(timer);}
}
if (word) {
  document.querySelector('[name=hanzi]').value=word;
  document.querySelector('#word').textContent=word;
  panel.hidden=false;
  panel.scrollIntoView({block:'start'});
  fetch('cases.json').then(response => response.json()).then(catalogue => {
    const featured = catalogue.cases.find(item => item.character === word);
    if (featured) {
      const link = document.querySelector('#featured-result');
      link.href = featured.url;
      link.hidden = false;
    }
  }).catch(() => {});
  if (/^\p{Script=Han}$/u.test(word)) lookupWord();
  else message.textContent='请一次输入一个汉字。';
}
retry.addEventListener('click',lookupWord);
</script></body></html>
