const {cases,selected}={"cases": [{"id": "nian-quanzhou", "place": "福建泉州", "title": "赶回来吃的那顿饭", "meal_name": "合家“围炉”吃年饭，正文也称“团圆饭”。", "recorded_action": "过去泉州有不少人外出谋生，除夕赶回家与家人同桌吃饭。", "source_quote": "除夕日均要回家团聚", "body": "泉州的年俗记录写到，过去有人常年在外谋生，到了除夕，便赶回家和家人围炉吃年饭。", "source_title": "新春忆旧俗", "source_section": "合家“围炉”吃年饭", "source_url": "https://www.quanzhou.gov.cn/lyb/mfms/ssms/200901/t20090123_3174.htm"}, {"id": "nian-jinmen", "place": "金门", "title": "给没回来的人留一副碗筷", "meal_name": "“除夕守岁围炉”一节使用“年夜饭”。", "recorded_action": "游子未能返乡时，家人留座、摆碗筷，还从每道菜象征性地留一点。", "source_quote": "未克返鄉過年的遊子，則保留席次及碗筷", "body": "金门的年俗记录里，家人未能返乡，年夜饭桌上仍给他留座、摆碗筷。每道菜也留一点，让缺席的人在这顿饭里有个位置。", "source_title": "认识金门小百科·岁时节庆及迎神祭祖篇", "source_section": "第4-3-3节", "source_url": "https://cabkc.kinmen.gov.tw/uploads/cabkc/files/201812/882f2606-5376-4011-a742-41570dc15277.pdf"}, {"id": "nian-hongkong", "place": "香港", "title": "长辈先动筷，晚辈送祝福", "body": "香港家庭及妇女资讯平台采访的学者提到，传统团年饭可围圆桌而坐，长辈先动筷，晚辈向长辈说祝福语。", "recorded_action": "长辈先动筷，晚辈给长辈送上祝福。", "source_title": "香港家庭及妇女资讯平台《春节习俗重视家庭团圆》", "source_url": "https://www.familyandwomen.gov.hk/tc/story/2025012012273736147.html"}, {"id": "nian-macao", "place": "澳门", "title": "贴挥春，吃团年饭", "body": "澳门非遗名录公开咨询文本记载，澳门土生葡人社群也重视春节，家中会打扫、贴挥春、摆放装有贺年糖果的全盒，并吃团年饭。", "recorded_action": "澳门土生葡人家庭贴挥春、摆全盒，也吃团年饭。", "source_title": "澳门非遗名录公开咨询文本 · 春节第5.2节", "source_url": "https://www.gov.mo/zh-hant/wp-content/uploads/sites/4/2024/12/%E9%A0%85%E7%9B%AE%E5%88%97%E5%85%A5%E9%9D%9E%E9%81%BA%E5%90%8D%E9%8C%84%E5%85%AC%E9%96%8B%E8%AB%AE%E8%A9%A2-%E4%B8%AD%E6%96%87.pdf"}, {"id": "nian-singapore", "place": "新加坡", "title": "一起把鱼生捞起来", "body": "新加坡的非遗资料记载，春节期间，人们一同夹起鱼生、抛拌食材，寄托对新一年的祝愿。有时也会邀请其他族群的朋友参与。这项活动可贯穿春节期间。", "recorded_action": "亲友一起捞鱼生，有时还邀请其他族群的朋友加入。", "source_title": "新加坡国家文物局 Roots · Yusheng and Lo Hei", "source_url": "https://www.roots.gov.sg/ich-landing/ich/yusheng-and-lo-hei"}], "selected": "nian-jinmen"};
const board=document.querySelector('main'), modal=document.querySelector('dialog'), chosen=document.querySelector('#chosen');
let current=cases.find(c=>c.id===selected)||cases[1];
function place(el,[x,y,w,h]){Object.assign(el.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'})}
function hotspot(label,box,action,url){
 const el=document.createElement(url?'a':'button');el.className='hit';el.setAttribute('aria-label',label);el.title=label;place(el,box);
 if(url){el.href=url;el.target='_blank';el.rel='noopener'}else el.onclick=action;
 board.append(el);return el;
}
function read(c){
 modal.querySelector('h2').textContent=c.place+'｜'+c.title;
 modal.querySelector('p').textContent=c.body;
 const source=modal.querySelector('a');source.href=c.source_url;source.textContent=c.source_title+' ↗';
 document.querySelector('#keep').onclick=()=>{current=c;updateCard();modal.close()};
 modal.showModal();
}
function updateCard(){
 chosen.hidden=current.id==='nian-jinmen';
 chosen.replaceChildren();const heading=document.createElement('strong');heading.textContent=current.place+'｜'+current.title;
 chosen.append(heading,document.createElement('br'),current.recorded_action);
}
document.querySelector('#close').onclick=()=>modal.close();
function save(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([['字里寻踪 · 年',current.place+'｜'+current.title,current.recorded_action,current.source_title,current.source_url].join('\n')],{type:'text/plain;charset=utf-8'}));
 a.download='我的寻踪卡-年.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// Coordinates measured on the 418 × 627 portrait proof.
function box(x,y,w,h){return [100*x/418,100*y/627,100*w/418,100*h/627]}
const cards=[[76,204,165,174],[249,204,164,174],[73,386,108,104],[188,386,110,104],[305,386,109,104]];
const targets=cards.map(([x,y,w,h],i)=>{
 const c=cases[i];
 const tile=hotspot(c.place+' · 阅读记录',box(x,y,w,h-20),()=>read(c));
 tile.id=c.id;
 hotspot(c.place+' · 查看出处',box(x,y+h-20,w,20),null,c.source_url);
 return tile;
});
[215,256,298,341,382].forEach((y,i)=>hotspot(cases[i].place,box(8,y-12,59,24),()=>read(cases[i])));
const glyph=hotspot('查阅年字字源资料',box(198,127,84,29),null,'https://humanum.arts.cuhk.edu.hk/Lexis/lexi-mf/search.php?word=%E5%B9%B4');
const note=hotspot('阅读我的寻踪卡',box(18,526,384,68),()=>read(current));
place(chosen,box(191,535,209,59));updateCard();
hotspot('保存寻踪记录',box(296,591,115,33),save);
const nav=[['字形观察',glyph],['两岸',targets[0]],['港澳',targets[2]],['海外',targets[4]],['寻踪卡',note]];
nav.forEach(([label,target],i)=>hotspot(label,box([18,90,151,211,273][i],35,[70,60,59,59,69][i],28),()=>{
 target.scrollIntoView({block:'center',behavior:'smooth'});target.focus({preventScroll:true});
}));
</script></body></html>
