<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自由查字 · 字里寻踪</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9decd;color:#34271e;font:16px/1.65 system-ui,sans-serif}a{color:#8c291e}.lookup-shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:180px minmax(0,1fr);align-items:start;min-height:100dvh}.directory{position:sticky;top:0;padding:20px 16px;background:#fcf4e6;border-right:1px solid #d9c5ac}.directory nav{display:grid;gap:8px;margin-top:12px}nav a{padding:6px;border-radius:7px}nav a[aria-current]{background:#8c291e;color:white;text-decoration:none}main{min-height:100dvh;background:#f5edde;padding:clamp(20px,5vw,56px)}h1{font:700 clamp(2rem,5vw,3.2rem) KaiTi,serif;margin:18px 0 8px}.globe-search{display:grid;grid-template-columns:minmax(0,1fr) 72px 64px;max-width:580px;min-height:46px;border:1px solid #d9c5ac;border-radius:24px;background:#fffaef;margin:22px 0}.globe-search>*{font:inherit;min-width:0;background:transparent;border:0;color:inherit;padding:6px}.globe-search input{padding-left:16px;border-radius:24px 0 0 24px}.globe-search button{color:white;background:#8c291e;border-radius:0 24px 24px 0;cursor:pointer}.lookup-result{max-width:580px;padding:18px;border:1px solid #d9c5ac;border-radius:12px;background:#fffaef}@media(max-width:700px){.lookup-shell{display:block}.directory{position:static;border-bottom:1px solid #d9c5ac}.directory nav{display:flex;flex-wrap:wrap}main{min-height:70dvh}}
</style></head><body><div class="lookup-shell"><aside class="directory"><strong>字里寻踪</strong><nav aria-label="功能目录"><a href="./">首页</a><a href="featured.html">精选寻踪</a><a href="regions.html">四海故事</a><a href="lookup.html" aria-current="page">自由查字</a><a href="./" data-return-from-lookup hidden>返回故事</a></nav></aside><main>
<h1>自由查字</h1><p>输入一个汉字，或从六个精选字中选择。</p>
<form class="globe-search" id="lookup" role="search"><input id="hanzi" aria-label="输入一个汉字" placeholder="查一个感兴趣的字" autocomplete="off" enterkeyhint="search"><select id="featured-word" aria-label="快速选择精选汉字"><option value="">选字</option><option value="年">年</option><option value="门">门</option><option value="茶">茶</option><option value="船">船</option><option value="灯">灯</option><option value="圆">圆</option></select><button type="submit">查询</button></form>
<section id="lookup-result" class="lookup-result" hidden>
<h2 id="word"></h2><p id="status" role="status"></p><div id="definitions"></div>
<p><a id="source" target="_blank" rel="noopener">查看萌典原词条</a></p>
<button id="retry" type="button" hidden>重新查询</button> <a id="story">查看精选故事</a>
</section>
<script>
const input = document.getElementById('hanzi');
const featuredWord = document.getElementById('featured-word');
const panel = document.getElementById('lookup-result');
const heading = document.getElementById('word');
const status = document.getElementById('status');
const definitions = document.getElementById('definitions');
const source = document.getElementById('source');
const retry = document.getElementById('retry');
const story = document.getElementById('story');
const entries = {年:['年','nian.html'],门:['門','men.html'],茶:['茶','cha.html'],船:['船','chuan.html'],灯:['燈','deng.html'],圆:['圓','yuan.html']};
for (const character of ['门', '灯', '圆']) {
  entries[entries[character][0]] = entries[character];
}
let active;
async function lookup() {
  active?.abort();
  active = null;
  const word = input.value.trim();
  panel.hidden = false;
  definitions.replaceChildren();
  retry.hidden = true;
  source.hidden = true;
  story.hidden = true;
  heading.textContent = '';
  if (!/^\p{Script=Han}$/u.test(word)) {
    status.textContent = '请一次输入一个汉字。';
    panel.scrollIntoView({block:'nearest'});
    return;
  }
  const [form, storyUrl] = entries[word] ?? [word];
  const controller = new AbortController();
  active = controller;
  const timeout = setTimeout(() => controller.abort(), 10000);
  panel.hidden = false;
  heading.textContent = word;
  status.textContent = '正在查询萌典…';
  definitions.replaceChildren();
  retry.hidden = true;
  source.href = 'https://www.moedict.tw/' + encodeURIComponent(form);
  source.hidden = false;
  if (storyUrl) {
    story.href = storyUrl;
    story.hidden = false;
  }
  panel.scrollIntoView({block:'nearest'});
  try {
    const response = await fetch('https://www.moedict.tw/uni/' + encodeURIComponent(form), {signal:controller.signal});
    if (active !== controller || input.value.trim() !== word) return;
    if (response.status === 404) {
      status.textContent = '萌典未找到这个字，可尝试另一种简繁写法。';
      return;
    }
    if (!response.ok) throw new Error('Dictionary request failed');
    const entry = await response.json();
    if (active !== controller || input.value.trim() !== word) return;
    if (entry.title !== form || !Array.isArray(entry.heteronyms)) throw new Error('Unexpected entry');
    heading.textContent = word === form ? word : word + ' · 萌典字形「' + form + '」';
    status.textContent = [entry.radical && '部首 ' + entry.radical, entry.stroke_count && '词典字形笔画 ' + entry.stroke_count].filter(Boolean).join('　');
    for (const reading of entry.heteronyms) {
      const paragraph = document.createElement('p');
      paragraph.textContent = [reading.pinyin || reading.bopomofo, reading.definitions?.find(item => item.def)?.def].filter(Boolean).join('　');
      definitions.append(paragraph);
    }
  } catch {
    if (active !== controller || input.value.trim() !== word) return;
    status.textContent = '暂时无法取得词条，可重试或查看萌典原词条。';
    retry.hidden = false;
  } finally {clearTimeout(timeout);}
}
document.getElementById('lookup').addEventListener('submit', event => {
  event.preventDefault();
  lookup();
});
featuredWord.addEventListener('change', () => {
  if (!featuredWord.value) return;
  input.value = featuredWord.value;
  lookup();
});
input.addEventListener('input', () => {
  featuredWord.value = '';
  active?.abort();
  active = null;
  panel.hidden = true;
});
retry.addEventListener('click', lookup);
const requested = new URLSearchParams(location.search).get('hanzi');
if (requested) {
  input.value = requested;
  lookup();
}
</script>
<script>
(() => {
  if (window.parent !== window || !document.referrer) return;
  const from = new URL(document.referrer);
  if (from.origin !== location.origin || !/\/(nian|men|cha|chuan|deng|yuan)\.html$/.test(from.pathname)) return;
  const back = document.querySelector('[data-return-from-lookup]');
  back.href = from.href;
  back.hidden = false;
  back.addEventListener('click', event => {
    event.preventDefault();
    history.back();
  });
})();
</script></main></div></body></html>
