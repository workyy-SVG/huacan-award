<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四海故事 · 字里寻踪</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3ebdd;color:#34271e;font:16px/1.65 system-ui,sans-serif}a{color:#8c291e}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #8c291e;outline-offset:3px}
header{background:#fffaef;border-bottom:1px solid #d9c5ac}header div{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font:700 1.65rem KaiTi,serif;color:#8c291e}header nav{display:flex;gap:6px;flex-wrap:wrap}header a{padding:8px 11px;text-decoration:none;border-radius:8px}header [aria-current]{background:#f0dfc8}
header div,main{width:min(1208px,calc(100% - 36px));margin:auto}header div{padding:12px 0}main{padding:34px 0 24px}h1{font:700 clamp(2rem,5vw,3.4rem) KaiTi,serif;margin:0 0 8px}.intro,#status,footer{color:#6e5946}.intro{margin:0 0 24px}
.gallery{display:grid;grid-template-columns:196px minmax(0,1fr);gap:24px;align-items:start}.region{padding:16px;background:#fffaef;border:1px solid #d9c5ac;border-radius:14px}.region h2{font:700 1.28rem KaiTi,serif;color:#8c291e;margin:0 0 12px}.region .filters{display:grid;gap:8px}.words{display:flex;flex-wrap:wrap;gap:8px}.filters button{min-height:42px;border:1px solid #d9c5ac;border-radius:999px;background:#fffaef;color:#34271e;padding:5px 14px}.filters button[aria-pressed=true]{background:#8c291e;border-color:#8c291e;color:#fff}.words button{min-width:54px}
#status{margin:10px 0 12px;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{min-width:0;background:#fffaef;border:1px solid #d9c5ac;border-radius:12px;padding:12px;display:flex;flex-direction:column}.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.place{color:#8c291e;font-size:.9rem;margin:10px 0 2px}.tile h2{font:700 1.35rem/1.35 KaiTi,serif;margin:0 0 5px}.summary{margin:0 0 10px;color:#6e5946}.actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 15px;font-size:.9rem}footer{border-top:1px solid #d9c5ac;margin-top:24px;padding-top:13px;font-size:.9rem}
@media(max-width:940px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.gallery{grid-template-columns:1fr;gap:12px}.region .filters{display:flex;flex-wrap:wrap}.grid{grid-template-columns:1fr}main{padding-top:20px}}
</style></head><body>
<header><div><strong>字里寻踪</strong><nav aria-label="主导航"><a href="./">首页</a><a href="featured.html">精选寻踪</a><a href="regions.html" aria-current="page">四海故事</a><a href="lookup.html">自由查字</a></nav></div></header>
<main><h1>四海故事</h1><p class="intro">按字找故事，也可以用地区缩小范围。</p>
<div class="gallery"><aside class="region"><h2>按地区浏览</h2><div id="region" class="filters" role="group" aria-label="地区"></div></aside>
<section aria-label="地区故事"><div id="character" class="filters words" role="group" aria-label="汉字"></div><p id="status" role="status">正在加载故事…</p><div id="records" class="grid"></div></section></div>
<footer>四海故事还有许多。这里选取「年、门、茶、船、灯、圆」六个代表字，用完整案例讲述各地的生活与习俗。<a href="lookup.html">自由查字</a></footer>
</main>
<script>
const statusLine = document.getElementById('status');
const records = document.getElementById('records');
function element(tag, label, parent) {
  const node = document.createElement(tag);
  node.textContent = label;
  parent.append(node);
  return node;
}
function link(url, label, parent) {
  if (url) element('a', label, parent).href = url;
}
async function loadCatalogue() {
  try {
    const response = await fetch('cases.json');
    if (!response.ok) throw new Error('Catalogue unavailable');
    const data = await response.json();
    let region = '', character = '';
    const all = Object.values(data.regions).flat();
    function render() {
      const items = (region ? data.regions[region] : all)
        .filter(item => !character || item.character === character);
      records.replaceChildren();
      statusLine.textContent = items.length
        ? [region || '全部地区', character || '全部汉字', items.length + ' 条记录'].join(' · ')
        : '当前筛选下没有记录，请试试其他地区或汉字。';
      for (const item of items) {
        const tile = element('article', '', records);
        tile.className = 'tile';
        if (item.image) {
          const image = item.image;
          const picture = element('img', '', tile);
          picture.src = image;
          picture.alt = item.place + ' · ' + item.title + '（AI 场景示意）';
          picture.loading = 'lazy';
        }
        element('p', item.place + ' · ' + item.character, tile).className = 'place';
        element('h2', item.title, tile);
        element('p', item.body, tile).className = 'summary';
        const actions = element('div', '', tile);
        actions.className = 'actions';
        const chosen = data.cases.find(entry => entry.character === item.character);
        if (chosen) link(chosen.url, '查看精选故事 →', actions);
        link(item.source, '查看出处', actions);
      }
    }
    function filters(id, allLabel, options, setValue) {
      const container = document.getElementById(id);
      for (const value of ['', ...options]) {
        const button = element('button', value || allLabel, container);
        button.type = 'button';
        button.setAttribute('aria-pressed', String(!value));
        button.addEventListener('click', () => {
          setValue(value);
          for (const peer of container.children) peer.setAttribute('aria-pressed', String(peer === button));
          render();
        });
      }
    }
    filters('region', '全部地区', Object.keys(data.regions), value => {region = value;});
    filters('character', '全部', [...new Set(data.cases.map(item => item.character).concat(all.map(item => item.character)))], value => {character = value;});
    render();
  } catch {
    statusLine.textContent = '暂时无法加载资料，请刷新重试。';
  }
}
loadCatalogue();
</script></body></html>
