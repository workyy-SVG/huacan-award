<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四海故事 · 字里寻踪</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3ebdd;color:#34271e;font:16px/1.65 system-ui,sans-serif}a{color:#8c291e}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #8c291e;outline-offset:3px}
header{background:#fffaef;border-bottom:1px solid #d9c5ac}header div{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font:700 1.65rem KaiTi,serif;color:#8c291e}header nav{display:flex;gap:6px;flex-wrap:wrap}header a{padding:8px 11px;text-decoration:none;border-radius:8px}header [aria-current]{background:#f0dfc8}
header div,main{width:min(1208px,calc(100% - 36px));margin:auto}header div{padding:12px 0}main{padding:34px 0 24px}h1{font:700 clamp(2rem,5vw,3.4rem) KaiTi,serif;margin:0 0 8px}.intro,#status,footer{color:#6e5946}.intro{margin:0 0 24px}
.gallery{display:grid;grid-template-columns:196px minmax(0,1fr);gap:24px;align-items:start}.region{padding:16px;background:#fffaef;border:1px solid #d9c5ac;border-radius:14px}.region h2{font:700 1.28rem KaiTi,serif;color:#8c291e;margin:0 0 12px}.region .filters{display:grid;gap:8px}.words{display:flex;flex-wrap:wrap;gap:8px}.filters button{min-height:42px;border:1px solid #d9c5ac;border-radius:999px;background:#fffaef;color:#34271e;padding:5px 14px}.filters button[aria-pressed=true]{background:#8c291e;border-color:#8c291e;color:#fff}.words button{min-width:54px}
#status{margin:10px 0 12px;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{min-width:0;background:#fffaef;border:1px solid #d9c5ac;border-radius:12px;padding:12px;display:flex;flex-direction:column}.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.place{color:#8c291e;font-size:.9rem;margin:10px 0 2px}.tile h2{font:700 1.35rem/1.35 KaiTi,serif;margin:0 0 5px}.summary{margin:0 0 10px;color:#6e5946}.actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 15px;font-size:.9rem}footer{border-top:1px solid #d9c5ac;margin-top:24px;padding-top:13px;font-size:.9rem}
@media(max-width:940px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.gallery{grid-template-columns:1fr;gap:12px}.region .filters{display:flex;flex-wrap:wrap}.grid{grid-template-columns:1fr}main{padding-top:20px}}

.habit-search{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.habit-search input{flex:1;min-width:0;width:100%;min-height:44px;padding:8px 13px;border:1px solid #d9c5ac;border-radius:9px;background:#fffaef;color:inherit;font:inherit}
.habit-search input:focus-visible{outline:2px solid #8c291e;outline-offset:2px}
.habit-search button{min-height:44px;padding:6px 13px;border:1px solid #8c291e;border-radius:9px;background:#8c291e;color:#fff;white-space:nowrap}
.habit-search button[type=reset]{background:#fffaef;color:#8c291e;border-color:#d9c5ac}
.habit-field{position:relative;flex:1;min-width:0}
.habit-field input{padding-inline-end:52px}
.habit-picker{position:absolute;inset-block:0;inset-inline-end:0}
.habit-picker summary{display:grid;place-items:center;width:44px;height:100%;list-style:none;cursor:pointer;color:#702117;border-radius:0 9px 9px 0}
.habit-picker summary::-webkit-details-marker{display:none}
.habit-picker summary:focus-visible{outline:2px solid #8c291e;outline-offset:-3px}
.habit-picker summary span{width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg)}
.habit-suggestions{position:absolute;z-index:2;inset-inline-end:0;top:calc(100% + 5px);min-width:142px;margin:0;padding:5px;display:grid;background:#fffaef;border:1px solid #d9c5ac;border-radius:9px;box-shadow:0 5px 14px #34271e24}
.habit-search .habit-suggestions button{display:block;min-height:42px;border:0;background:transparent;color:#702117;text-align:start}
.habit-search .habit-suggestions button:hover,.habit-search .habit-suggestions button[aria-pressed=true]{background:#f0dfc8}
@media(max-width:640px){.gallery>section{display:contents}.habit-search{order:-1;margin:0}.gallery #status{margin:0}}
</style></head><body>
<main><h1>四海故事</h1><p class="intro">按习俗、汉字或地区找故事。</p>
<div class="gallery"><aside class="region"><h2>按地区浏览</h2><div id="region" class="filters" role="group" aria-label="地区"></div></aside>
<section aria-label="地区故事">
<form class="habit-search" id="habit-search" role="search" aria-label="搜索习俗">
  <div class="habit-field">
    <input id="habit-keyword" type="search" aria-label="习俗关键词" placeholder="输入关键词或选择示例" autocomplete="off">
    <details class="habit-picker" id="habit-picker">
      <summary aria-label="选择习俗示例"><span aria-hidden="true"></span></summary>
      <div class="habit-suggestions" id="habit-suggestions" role="group" aria-label="习俗示例">
        <button type="button" aria-pressed="false">春节</button>
        <button type="button" aria-pressed="false">春联</button>
        <button type="button" aria-pressed="false">围炉</button>
        <button type="button" aria-pressed="false">饮茶</button>
        <button type="button" aria-pressed="false">龙舟</button>
        <button type="button" aria-pressed="false">花灯</button>
        <button type="button" aria-pressed="false">汤圆</button>
      </div>
    </details>
  </div>
  <button type="submit">搜索</button>
  <button type="reset" hidden>清空</button>
</form>
<div id="character" class="filters words" role="group" aria-label="汉字"></div><p id="status" role="status">正在加载故事…</p><div id="records" class="grid"></div></section></div>
<footer>四海故事还有许多。这里选取「年、门、茶、船、灯、圆」六个代表字，用完整案例讲述各地的生活与习俗。<a href="./#lookup">自由查字</a></footer>
</main>
<script>
const statusLine = document.getElementById('status');
const records = document.getElementById('records');
const searchForm = document.getElementById('habit-search');
const keywordInput = document.getElementById('habit-keyword');
const clearSearch = searchForm.querySelector('[type=reset]');
const picker = document.getElementById('habit-picker');
const suggestions = document.querySelectorAll('#habit-suggestions button');
const normalize = text => text.normalize('NFKC').toLowerCase();
const springCustoms = /除夕|年夜饭|团年饭|围炉|春联|挥春|门神|捞鱼生|春节|年节/;
function element(tag, label, parent) {
  const node = document.createElement(tag);
  node.textContent = label;
  parent.append(node);
  return node;
}
function link(url, label, parent) {
  if (url) element('a', label, parent).href = url;
}
async function loadCatalogue() {
  try {
    const response = await fetch('cases.json');
    if (!response.ok) throw new Error('Catalogue unavailable');
    const data = await response.json();
    let region = '', character = '', keyword = '';
    const all = Object.values(data.regions).flat();
    const searchText = new Map(all.map(item => {
      const text = [item.character, item.place, item.title, item.body].join(' ');
      return [item, normalize(springCustoms.test(text) ? text + ' 春节 新春 过年' : text)];
    }));
    function render() {
      const terms = normalize(keyword).split(/\s+/).filter(Boolean);
      clearSearch.hidden = !keyword && !keywordInput.value;
      for (const button of suggestions) {
        button.setAttribute('aria-pressed', String(keyword === button.textContent));
      }
      const items = (region ? data.regions[region] : all)
        .filter(item => (!character || item.character === character) &&
          terms.every(term => searchText.get(item).includes(term)));
      records.replaceChildren();
      statusLine.textContent = items.length
        ? [region || '全部地区', character || '全部汉字',
          keyword && '关键词「' + keyword + '」', items.length + ' 条记录'].filter(Boolean).join(' · ')
        : '没有找到符合条件的故事，请换个关键词或调整筛选。';
      for (const item of items) {
        const tile = element('article', '', records);
        tile.className = 'tile';
        if (item.image) {
          const image = item.image;
          const picture = element('img', '', tile);
          picture.src = image;
          picture.alt = item.place + ' · ' + item.title + '（AI 场景示意）';
          picture.loading = 'lazy';
        }
        element('p', item.place + ' · ' + item.character, tile).className = 'place';
        element('h2', item.title, tile);
        element('p', item.body, tile).className = 'summary';
        const actions = element('div', '', tile);
        actions.className = 'actions';
        const chosen = data.cases.find(entry => entry.character === item.character);
        if (chosen) link(chosen.url, '查看精选故事 →', actions);
        link(item.source, '查看出处', actions);
      }
    }
    function filters(id, allLabel, options, setValue) {
      const container = document.getElementById(id);
      for (const value of ['', ...options]) {
        const button = element('button', value || allLabel, container);
        button.type = 'button';
        button.setAttribute('aria-pressed', String(!value));
        button.addEventListener('click', () => {
          setValue(value);
          for (const peer of container.children) peer.setAttribute('aria-pressed', String(peer === button));
          render();
        });
      }
    }
    searchForm.addEventListener('submit', event => {
      event.preventDefault();
      picker.open = false;
      keyword = keywordInput.value.trim();
      render();
    });
    for (const button of suggestions) {
      button.addEventListener('click', () => {
        keyword = keywordInput.value = button.textContent;
        picker.open = false;
        keywordInput.focus();
        render();
      });
    }
    document.addEventListener('click', event => {
      if (!picker.contains(event.target)) picker.open = false;
    });
    picker.addEventListener('keydown', event => {
      if (event.key === 'Escape' && picker.open) {
        event.preventDefault();
        picker.open = false;
        picker.querySelector('summary').focus();
      }
    });
    searchForm.addEventListener('reset', event => {
      event.preventDefault();
      picker.open = false;
      keywordInput.value = '';
      keyword = '';
      render();
      keywordInput.focus();
    });
    keywordInput.addEventListener('input', () => {
      clearSearch.hidden = !keywordInput.value && !keyword;
      if (!keywordInput.value && keyword) {
        keyword = '';
        render();
      }
    });
    filters('region', '全部地区', Object.keys(data.regions), value => {region = value;});
    filters('character', '全部', [...new Set(data.cases.map(item => item.character).concat(all.map(item => item.character)))], value => {character = value;});
    render();
  } catch {
    statusLine.textContent = '暂时无法加载资料，请刷新重试。';
  }
}
loadCatalogue();
</script></body></html>
